# Supabase project configuration (used by Supabase CLI).
# Remote project (link): npx supabase@latest link --project-ref fvxtsbnzadvuttoqcipo
# Then deploy functions: supabase functions deploy payfast-itn

project_id = "paidly"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
# Paidly verification landing (/auth/verified, incl. /auth/verified/pos-invite/<token>).
additional_redirect_urls = ["https://localhost:5173", "http://localhost:5173/auth/verified", "http://localhost:5173/auth/verified/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Require email confirmation before sign-in (use Inbucket in local CLI for test emails).
enable_confirmations = true

# Paidly-branded templates — generated by scripts/generate-auth-email-templates.mjs.
# Production uses the same files, pasted into Dashboard → Authentication → Email Templates.
[auth.email.template.confirmation]
subject = "Confirm your Paidly email"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your Paidly password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.magic_link]
subject = "Your Paidly sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.email_change]
subject = "Confirm your new Paidly email"
content_path = "./supabase/templates/change-email.html"

[auth.email.template.invite]
subject = "You've been invited to Paidly"
content_path = "./supabase/templates/invite.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

# Global verify_jwt removed: newer Supabase CLI expects per-function [functions.<name>] or map.
# To set verify_jwt per function, add e.g.:
#   [functions.payfast-itn]
#   verify_jwt = false

# Called with shared secret (Database Webhook / scripts), not end-user JWT.
[functions.purge-user-storage]
verify_jwt = false
